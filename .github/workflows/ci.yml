name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Allows all cells to finish to get full diagnostic feedback
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]               # Run against multiple current LTS versions

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js Environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  # Speeds up local execution runtime significantly

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute Automated Tests
        run: npm test

  lint-docs:
    name: Lint Documentation (Vale)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Vale
        uses: errata-ai/vale-action@85f9f7f2c5f449ac0ae5b66662961bae3f77ca6a # v2.1.2
        with:
          vale_flags: "--config=.vale.ini"
          files: '["README.md"]'
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}