name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # Allows all cells to finish to get full diagnostic feedback
      matrix:
        os: [ubuntu-latest, windows-latest]  # Task 2 matrix requirement
        node-version: [20, 22]               # Run against multiple current LTS versions

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4 # Pinned version to prevent supply-chain flaws

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  # Speeds up local execution runtime significantly

      - name: Install Node Dependencies
        run: npm ci

      - name: Execute Automated Tests
        run: npm test

  lint-docs:
    name: Lint Documentation (Vale)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Vale
        uses: errata-ai/vale-action@reviewdog
        with:
          vale_flags: "--config=.vale.ini"
          files: '["README.md"]'
          fail_on_error: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}